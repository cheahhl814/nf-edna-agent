[workspace]
channels = ["conda-forge", "bioconda", "anaconda"]
name = "visualization"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
# Replaces the pre-v1.2.0-era phantom path: this env was referenced by the
# edna-visualize recipes but only materialized (hoisted to the skill root)
# in v1.3.0 — the figure-generation env for edna-visualize stages 1-5.
r-base = "4.5.*"
r-argparse = ">=2.3.1,<3"
"r-data.table" = ">=1.17.8,<2"
r-ggplot2 = ">=4.0.2,<5"
bioconductor-mia = ">=1.18.0,<2"
bioconductor-miaviz = ">=1.18.0,<2"
bioconductor-sechm = ">=1.18.0,<2"
bioconductor-complexheatmap = ">=2.22.0,<3"
bioconductor-s4vectors = ">=0.48.0,<0.49"
bioconductor-genomeinfodb = ">=1.42.0,<2"
# v1.3.0 additions: rarefaction-curve-style plotting needs no extra deps, but
# the alpha-boxplot significance annotations and the PCoA ordination do.
r-vegan = ">=2.7_2,<3"
r-ape = ">=5.8_1,<6"
r-rstatix = ">=0.7.2,<0.8"
r-ggpubr = ">=0.6.2,<0.7"
r-rbiom = "==2.2.1"
